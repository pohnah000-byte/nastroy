<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>СВОИ</title>
<meta name="description" content="СВОИ — бесплатный офлайн-плеер для своей музыки. Без подписок.">
<meta name="theme-color" content="#0b0b0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="СВОИ">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
<link rel="icon" type="image/png" href="icon-192.png?v=4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: асфальт с бензиновой лужей на весь экран; мобильный — док снизу, ПК — боковая панель слева; «Сейчас играет» — полноэкранный лист */
:root{
  --bg:#0f0f13; --panel:#0b0b0e; --raise:#1a1a20; --raise2:#232229; --line:#2c2b33;
  --ink:#f7f5f2; --muted:#b9b4bf; --orange:#ff7a1a; --yellow:#ffd23f; --pink:#ff3d8b; --cyan:#3fe0d0;
  --neon:linear-gradient(100deg,#ff7a1a 0%,#ffd23f 45%,#ff3d8b 100%);
  --f-display:"Dela Gothic One","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hh:88px; --bh:170px; --navh:76px; --side:0px; --e:0; --ease:cubic-bezier(.2,.8,.2,1);
  --gl:max(18px,env(safe-area-inset-left,0px)); --gr:max(18px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--panel)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button,input{font:inherit;color:inherit}
.app{position:fixed;top:0;left:0;right:0;height:var(--appH,100%);overflow:hidden;background:var(--bg)}
main{position:absolute;inset:0}
canvas.puddle{position:absolute;inset:0;width:100%;height:100%;display:block}
.fallback-bg{background:radial-gradient(ellipse at 50% 46%,#ff3d8b 0%,#ff7a1a 18%,#ffd23f 28%,#1b1b22 48%,#0f0f13 75%)}

/* glass bars */
header{position:absolute;top:0;right:0;left:var(--side);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:max(8px,calc(env(safe-area-inset-top,0px) - 2px)) var(--gr) 10px var(--gl);transition:background .4s var(--ease)}
header.solid{background:linear-gradient(to bottom,rgb(11 11 14) 0%,rgb(11 11 14 / .94) 72%,rgb(11 11 14 / 0) 100%)}
.logo{font-family:var(--f-display);font-size:30px;letter-spacing:.03em;line-height:1;background:var(--neon);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgb(255 122 26 / .35))}
.hacts{display:flex;gap:10px;align-items:center}
.hbtn{width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:var(--raise);color:var(--ink);border:1px solid var(--line)}
.hbtn.main{background:var(--neon);color:#17110a;border:0;box-shadow:0 6px 22px -6px rgb(255 122 26 / .8)}
.hbtn svg{width:24px;height:24px}
.dockwrap{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;flex-direction:column}
.bottom{position:relative;background:rgb(11 11 14 / .9);-webkit-backdrop-filter:blur(26px) saturate(1.4);backdrop-filter:blur(26px) saturate(1.4);border-top:1px solid rgb(255 255 255 / .08)}
nav{position:relative;display:grid;grid-template-columns:repeat(4,1fr);background:rgb(11 11 14 / .96);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);border-top:1px solid rgb(255 255 255 / .06);
  padding:0 env(safe-area-inset-right,0px) max(6px,calc(env(safe-area-inset-bottom,0px) - 14px)) env(safe-area-inset-left,0px)}
nav .brand{display:none}
nav button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px 4px;cursor:pointer;font-size:13px;font-weight:800;position:relative}
nav button svg{width:26px;height:26px;transition:transform .45s var(--ease),filter .45s var(--ease)}
nav button[aria-current="page"]{color:var(--ink)}
nav button[aria-current="page"] svg{color:var(--yellow);transform:translateY(-3px);filter:drop-shadow(0 4px 10px rgb(255 122 26 / .7))}
nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--neon);box-shadow:0 0 16px 2px rgb(255 122 26 / .7)}

/* views */
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:1;
  padding:calc(var(--hh) + 16px) var(--gr) calc(var(--bh) + 24px) calc(var(--side) + var(--gl))}
.view:not(.home){background:rgb(15 15 19 / .93)}
.view.home{display:flex;flex-direction:column;align-items:center;overflow:hidden;padding-bottom:calc(var(--bh) + 14px)}
.stage{flex:1;min-height:0;width:100%;display:grid;place-items:center}
.oracle{width:100%;max-width:520px;display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-radius:24px;background:rgb(12 12 16 / .58);border:1px solid rgb(255 255 255 / .1);
  -webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);box-shadow:0 20px 50px -20px rgb(0 0 0 / .8)}
.olbl{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.olbl i{font-style:normal;font-size:16px;color:var(--yellow);filter:drop-shadow(0 0 8px rgb(255 210 63 / .8))}
.olbl span{background:var(--neon);-webkit-background-clip:text;background-clip:text;color:transparent}
.oracle p{margin:0;font-size:17px;line-height:1.42;font-weight:700;color:var(--ink);text-shadow:0 1px 2px rgb(0 0 0 / .5)}
.otrack{display:flex;align-items:center;gap:10px;background:rgb(255 255 255 / .07);border:1px solid rgb(255 255 255 / .1);border-radius:999px;padding:6px 6px 6px 14px;cursor:pointer;color:var(--ink);text-align:left;min-height:44px}
.otrack small{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);flex:none}
.otrack b{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.otrack span{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--neon);color:#17110a;flex:none}
.otrack span svg{width:15px;height:15px}
.inner{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.center{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;line-height:1.15;letter-spacing:.01em}
.hint{color:var(--muted);font-size:15px;margin:0;line-height:1.5}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.count{display:inline-flex;align-items:center;height:44px;padding:0 4px;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:800}

.bigplay{position:relative;width:92px;height:92px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:#fff;
  background:rgb(255 255 255 / .13);border:1px solid rgb(255 255 255 / .4);-webkit-backdrop-filter:blur(12px) saturate(1.6);backdrop-filter:blur(12px) saturate(1.6);
  box-shadow:inset 0 1px 0 rgb(255 255 255 / .4),inset 0 -8px 20px rgb(255 255 255 / .06),0 10px 40px -12px rgb(0 0 0 / .7);transform:scale(calc(1 + var(--e) * .08));transition:transform .12s linear}
.bigplay svg{width:34px;height:34px;filter:drop-shadow(0 2px 6px rgb(0 0 0 / .45))}
.bigplay::before,.bigplay::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:2px solid rgb(255 180 90 / .7);opacity:0;pointer-events:none}
.wavetitle{font-family:var(--f-display);font-size:clamp(34px,9vw,52px);margin:6px 0 0;line-height:1;text-shadow:0 2px 0 rgb(0 0 0 / .35),0 0 30px rgb(255 61 139 / .45)}
.wavesub{margin:0;font-size:17px;font-weight:800;text-shadow:0 1px 3px rgb(0 0 0 / .7)}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.stat{background:rgb(11 11 14 / .6);border:1px solid rgb(255 255 255 / .12);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#sortChips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gr)) 0 0;padding-right:var(--gr)}#sortChips::-webkit-scrollbar{display:none}#sortChips .chip{flex:none}
.chip{font-size:15px;font-weight:800;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--raise);color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--neon);color:#17110a;border-color:transparent;box-shadow:0 6px 22px -8px rgb(255 61 139 / .8)}
.btn{font-size:16px;font-weight:800;border:0;border-radius:999px;padding:0 22px;cursor:pointer;background:var(--neon);color:#17110a;min-height:50px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:20px;height:20px}
.btn.ghost{background:var(--raise);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#ff3d5e;color:#fff}
.btn:disabled,.chip:disabled{opacity:.45;cursor:not-allowed}
.search{position:relative}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.search input[type=text]{padding-left:48px;border-radius:999px;background:var(--raise)}
input[type=text]{width:100%;font-size:17px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:13px 16px;min-height:50px;-webkit-appearance:none;appearance:none}
input:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgb(255 122 26 / .25)}
button:focus-visible,.row:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.chip,.btn,.ib,.pp,nav button,.row,.fcard,.hbtn{transition:background-color .3s var(--ease),color .3s var(--ease),border-color .3s var(--ease),transform .25s var(--ease),opacity .3s}
.chip:active,.btn:active,.ib:active,.pp:active,.fcard:active,.hbtn:active{transform:scale(.94)}

.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:8px 6px;border-radius:16px;cursor:pointer}
.row.grab{grid-template-columns:22px 52px 1fr auto}
.row.sel{grid-template-columns:26px 52px 1fr}
.row:hover{background:var(--raise)}
.row.playing .t1{background:var(--neon);-webkit-background-clip:text;background-clip:text;color:transparent}
.row.picked{background:var(--raise)}
.row.ghost .cover,.row.ghost .t1,.row.ghost .t2{background:linear-gradient(90deg,var(--raise) 25%,var(--raise2) 50%,var(--raise) 75%);background-size:200% 100%;animation:shimmer 1.2s linear infinite;color:transparent;border-radius:8px}
.row.ghost .t1{height:16px;width:60%;margin-bottom:6px}.row.ghost .t2{height:12px;width:40%}
@keyframes shimmer{to{background-position:-200% 0}}
.cover{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-size:19px;color:#17110a;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgb(255 255 255 / .1)}
.meta{min-width:0}
.t1{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{color:var(--muted);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:rgb(255 122 26 / .18);color:var(--yellow);margin-left:6px;vertical-align:2px}
.acts{display:flex}
.ib{width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none}
.ib:hover{background:var(--line);color:var(--ink)}
.ib svg{width:22px;height:22px}
.ib.on{color:var(--pink)}
.ib.act{color:var(--yellow)}
.grip{width:22px;height:52px;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab}
.grip svg{width:18px;height:18px}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;color:#17110a}
.row.picked .check{background:var(--neon);border-color:transparent}
.check svg{width:15px;height:15px}
.sortable-ghost{opacity:.35}
.empty{border:1.5px dashed var(--line);border-radius:20px;padding:30px 18px;text-align:center;color:var(--muted);font-size:16px;line-height:1.5;display:flex;flex-direction:column;gap:14px;align-items:center}

.fgrid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.fcard{width:calc(50% - 6px);max-width:220px;text-align:left;border:1px solid var(--line);background:var(--raise);color:var(--ink);border-radius:20px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:132px;min-width:0}
.fcard .fi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#17110a}
.fcard .fi svg{width:22px;height:22px}
.fcard b{font-size:16px;overflow-wrap:anywhere}
.fcard span{font-size:13px;color:var(--muted);font-weight:800}
.fcard.new{border-style:dashed;background:transparent;color:var(--muted);align-items:center;justify-content:center;text-align:center}
.fcard.new .fi{background:var(--line);color:var(--ink)}
.fgrid.only .fcard.new{width:min(260px,80%);max-width:none;min-height:150px}

.prog{display:flex;flex-direction:column;gap:8px}
.prog .trk{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog .trk i{display:block;height:100%;width:0;background:var(--neon);transition:width .25s}

.selbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px var(--gr) 12px var(--gl);border-bottom:1px solid var(--line);font-weight:800}
.mini{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px var(--gr) 10px var(--gl);position:relative;cursor:pointer}
.mbar{position:absolute;left:0;right:0;top:-2px;height:3px;background:rgb(255 255 255 / .08)}
.mbar i{display:block;height:100%;width:0;background:var(--neon);box-shadow:0 0 10px rgb(255 122 26 / .8)}
.ctrl{display:flex;gap:2px;align-items:center}
.pp{width:50px;height:50px;border-radius:50%;border:0;background:var(--ink);color:#121118;display:grid;place-items:center;cursor:pointer;flex:none}
.pp svg{width:22px;height:22px}
#mCover{transform:scale(calc(1 + var(--e) * .06));transition:transform .2s linear}

/* now playing */
.np{position:fixed;inset:0;z-index:15;background:radial-gradient(ellipse at 50% 30%,#2a1a1a,#0d0c10 70%);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 12px) var(--gr) calc(env(safe-area-inset-bottom,0px) + 18px) var(--gl);transform:translateY(100%);transition:transform .5s var(--ease);visibility:hidden}
.np.open{transform:none;visibility:visible}
.np > *{width:100%;max-width:560px;margin-left:auto;margin-right:auto}
.np-top{display:flex;justify-content:space-between;align-items:center}
.np-top .lbl{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:center}
.np-art{flex:1;min-height:0;display:grid;place-items:center;padding:16px 0}
.np-art .art{width:min(78vw,360px,42vh);aspect-ratio:1;max-width:100%;border-radius:28px;background-size:cover;background-position:center;display:grid;place-items:center;font-family:var(--f-display);font-size:76px;color:#17110a;
  box-shadow:0 30px 70px -20px rgb(255 61 139 / .35),0 30px 60px -20px rgb(0 0 0 / .7);transform:scale(calc(.94 + var(--e) * .06));transition:transform .3s var(--ease)}
.np-meta{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.np-meta .t1{font-size:22px}
.np-meta .t2{font-size:16px}
.seek{margin-top:14px}
.seek input{width:100%;-webkit-appearance:none;appearance:none;height:28px;background:transparent;cursor:pointer}
.seek input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--orange),var(--pink) var(--p,0%),rgb(255 255 255 / .15) var(--p,0%))}
.seek input::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;margin-top:-7px;box-shadow:0 2px 8px rgb(0 0 0 / .4)}
.seek input::-moz-range-track{height:6px;border-radius:3px;background:rgb(255 255 255 / .15)}
.seek input::-moz-range-progress{height:6px;border-radius:3px;background:var(--orange)}
.seek input::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:0}
.times{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums}
.np-ctrl{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:4px}
.np-ctrl .ib{width:54px;height:54px}
.np-ctrl .ib svg{width:28px;height:28px}
.skip{position:relative}
.skip b{position:absolute;font-size:9px;font-weight:800;top:50%;left:50%;transform:translate(-50%,-38%);color:currentColor}
.np-ctrl .pp{width:78px;height:78px;background:var(--neon);color:#17110a;box-shadow:0 10px 30px -8px rgb(255 61 139 / .7)}
.np-ctrl .pp svg{width:32px;height:32px}
.np-extra{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:6px}
.np-extra .chip{font-size:14px;padding:0 14px}
.ib small{position:absolute;font-size:9px;font-weight:800;bottom:6px;right:8px}

/* sheets & toast */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .6);z-index:20;display:grid;align-items:end;justify-items:center}
.sheet{width:min(560px,100%);max-height:86%;overflow-y:auto;background:var(--raise);border-radius:26px 26px 0 0;display:flex;flex-direction:column;gap:12px;padding:20px var(--gr) calc(20px + env(safe-area-inset-bottom,0px)) var(--gl)}
.sheet label{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mhead{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding-bottom:6px;border-bottom:1px solid var(--line)}
.menu{display:flex;flex-direction:column}
.mi{display:flex;align-items:center;gap:14px;background:none;border:0;padding:14px 4px;font-size:17px;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;border-radius:12px}
.mi:hover{background:var(--raise2)}
.mi svg{width:22px;height:22px;color:var(--muted);flex:none}
.mi.danger,.mi.danger svg{color:#ff5e7a}
.fopt{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;padding:14px 16px;cursor:pointer;font-weight:700;font-size:16px;display:flex;justify-content:space-between;gap:10px}
.fopt span{color:var(--muted);font-size:14px}
.flist{display:flex;flex-direction:column;gap:8px}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bh) + 16px);background:var(--ink);color:#121118;font-weight:800;padding:12px 18px;border-radius:999px;z-index:30;font-size:15px;max-width:calc(100% - 32px);text-align:center}
.kv{display:flex;justify-content:space-between;gap:12px;font-weight:700;padding:6px 0;border-bottom:1px solid var(--line)}
.kv span:last-child{color:var(--muted)}

/* splash */
.splash{position:fixed;inset:0;z-index:50;background:#0b0b0e;display:grid;place-items:center;transition:opacity .7s var(--ease),visibility .7s}
.splash.gone{opacity:0;visibility:hidden}
.splash .sl{position:relative;z-index:1;text-align:center}
.splash .sl b{display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(56px,16vw,120px);line-height:1;background:var(--neon);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgb(255 61 139 / .6))}
.splash .sl span{display:block;margin-top:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;font-size:13px;color:rgb(255 255 255 / .8)}

/* desktop: sidebar */
@media (min-width:960px){
  :root{--side:250px; --navh:0px}
  .dockwrap{display:contents}
  .bottom{position:absolute;left:var(--side);right:0;bottom:0;z-index:5}

function renderOracle(){
  const d = new Date(), hr = d.getHours(), am = hr >= 5 && hr < 17, base = new Date(d);
  if(hr < 5) base.setDate(base.getDate() - 1);
  const dn = Math.floor(new Date(base.getFullYear(), base.getMonth(), base.getDate()).getTime() / 864e5);
  const list = am ? ORACLE_AM : ORACLE_PM, txt = list[am ? dn % list.length : (dn * 5 + 3) % list.length];
  $("oIco").textContent = am ? "☀" : "☾";
  $("oLbl").textContent = am ? `Утро · предсказание на ${base.toLocaleDateString("ru-RU", { day:"numeric", month:"long" })}` : "Вечер · похвала и инсайт дня";
  if($("oText").textContent !== txt) $("oText").textContent = txt;
  const tb = $("oTrack");
  if(tracks.length){ const t = tracks[(dn * 13 + (am ? 7 : 3)) % tracks.length]; tb.hidden = false; tb.dataset.id = t.id; tb.querySelector("b").textContent = t.title + (t.artist ? " — " + t.artist : ""); }
  else tb.hidden = true;
}

async function removeTracks(ids){

  tracks = tracks.filter(t => !set.has(t.id)); favs = favs.filter(id => !set.has(id)); folders.forEach(f => f.ids = f.ids.filter(id => !set.has(id)));
  saveAll(); renderAll(); toast(`Удалено: ${tw(ids.length)}`);
  for(const id of ids){ await delBlob("audio", id); await delBlob("art", id); if(artUrls.has(id)){ URL.revokeObjectURL(artUrls.get(id)); artUrls.delete(id); } }

const audio = $("audio");
let queue = [], qi = -1, cur = null, srcUrl = null, playingFrom = "", countedPlay = false;
function shuffled(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function playList(ids, startId, from){
  playingFrom = from || "";
  if(settings.shuffle){ const rest = shuffled(ids.filter(id => id !== startId)); queue = startId ? [startId, ...rest] : rest; qi = 0; }
  else { queue = ids.slice(); qi = Math.max(0, startId ? queue.indexOf(startId) : 0); }
  load(true);
}
async function load(autoplay, at = 0){
  const id = queue[qi]; cur = id ? byId(id) : null; if(!cur){ showNow(); return; }
  const b = await getBlob("audio", cur.id);
  if(!b || b === true){ toast("Файл трека не найден в памяти"); return; }
  if(srcUrl) URL.revokeObjectURL(srcUrl);
  analyze(cur.id, b);
  srcUrl = URL.createObjectURL(b); audio.src = srcUrl; audio.playbackRate = settings.rate || 1; countedPlay = false;
  if(at) audio.addEventListener("loadedmetadata", () => { try{ audio.currentTime = at; }catch{} }, {once:true});
  if(autoplay) audio.play().catch(() => {});
  showNow(); renderAll(); updateSession();
  store.set("svoi4-last", { queue, qi, from: playingFrom });
}
function queueNext(id){ if(!cur){ playList([id], id, "Медиатека"); return; } const at = queue.indexOf(id); if(at >= 0 && at !== qi){ queue.splice(at, 1); if(at < qi) qi--; } if(at !== qi) queue.splice(qi + 1, 0, id); toast("Сыграет следующим"); }
function next(auto){
  if(!queue.length) return;
  if(auto && settings.repeat === "one"){ audio.currentTime = 0; audio.play(); return; }
  if(auto && sleepEnd === "track"){ sleepEnd = null; updateSleep(); audio.pause(); return; }
  if(qi + 1 >= queue.length){ if(settings.repeat === "all" || !auto) qi = 0; else { audio.pause(); audio.currentTime = 0; return; } } else qi++;
  load(true);
}
function prev(hard){ if(!queue.length) return; if(!hard && audio.currentTime > 3){ audio.currentTime = 0; return; } qi = (qi - 1 + queue.length) % queue.length; load(true); }
const skip = s => { if(!cur) return; audio.currentTime = Math.max(0, Math.min((audio.duration || 0) - .2, audio.currentTime + s)); };
function toggle(){ if(!cur){ if(tracks.length) playList(tracks.map(t => t.id), null, "Вся музыка"); else $("fileIn").click(); return; } audio.paused ? audio.play() : audio.pause(); }
audio.addEventListener("ended", () => next(true));
audio.addEventListener("error", () => { if(cur && audio.getAttribute("src")) toast("Не получилось включить этот файл"); });
$("wavePlay").onclick = () => { if(cur){ toggle(); return; } if(!tracks.length){ $("fileIn").click(); return; } settings.shuffle = true; saveAll(); playList(tracks.map(t => t.id), null, "Моя волна"); };

const NOISE = `precision highp float;
float h(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f); return mix(mix(h(i), h(i+vec2(1.,0.)), f.x), mix(h(i+vec2(0.,1.)), h(i+vec2(1.,1.)), f.x), f.y); }

`;
// splash: gasoline puddle on asphalt
const PUDDLE = NOISE + `uniform vec2 R; uniform float T; uniform float Z;
void main(){
  vec2 uv = (gl_FragCoord.xy - .5*R) / min(R.x, R.y);
  float g = n(uv*150.)*.5 + n(uv*60.)*.3 + fbm(uv*6.)*.4;
  vec3 asph = vec3(.06, .06, .07) + g*.08 + smoothstep(.8, .96, n(uv*95. + 3.)) * vec3(.12, .12, .13);
  vec2 p = uv * vec2(1., 1.12) / Z;
  float d = length(p) + (fbm(p*1.8 + vec2(T*.03, -T*.02)) - .5)*.6 - .5;
  float pud = smoothstep(.012, -.012, d), rim = smoothstep(.06, .0, abs(d));
  vec2 q = p + .35*vec2(fbm(p*2.2 + T*.04), fbm(p*2.2 - vec2(T*.05, 3.1)));
  float th = fbm(q*3.1 + vec2(T*.06, T*.04))*2.2 + length(p)*1.6 - T*.05;
  vec3 film = pal(th) * (.35 + .9*(.55 + .45*sin(th*18.)));
  vec3 inside = mix(vec3(.015, .012, .02), film, .25 + .75*smoothstep(.25, .75, fbm(q*2.4 + 7. + T*.02)));
  vec3 col = mix(asph*(1. - rim*.5), inside, pud);
  col += rim*(1. - pud)*mix(vec3(1., .45, .1), vec3(1., .2, .6), .5 + .5*sin(atan(p.y, p.x)*2. + T*.5))*.55;
  col += pud*pow(max(0., 1. - length(uv - vec2(-.16, .2))*2.4), 6.)*.4;

// home: circular neon liquid equalizer on dark brushed metal with film grain
const WAVE = NOISE + `uniform vec2 R; uniform float T; uniform vec3 B; uniform float K; uniform vec2 C; uniform float S; uniform float P;
void main(){

  float sheen = .5 + .5 * sin(q.x * 2.4 - q.y * 1.1 + .8);
  vec3 col = vec3(.07, .073, .085) + vec3(.06, .062, .072) * sheen * sheen + (br - .5) * .05 + (fbm(q * 2.5) - .5) * .045;

    col = mix(col, fl, ins);
  }

  col *= 1. - .5 * smoothstep(.45, 1.1, length(uv * .9));
  col += grain(fc, t) * .075;
  col += step(.996, h(vec2(floor(fc.x / 2.), floor(t * 10.)))) * .045;
  col *= .975 + .025 * h(vec2(floor(t * 20.), 7.));
  gl_FragColor = vec4(col, 1.);
}`;

// beat analysis: a decoded copy of the track gives real low/mid/high energy; playback itself stays a plain <audio> (works in background)
const envCache = new Map(); let envBusy = null;
async function analyze(id, blob){
  if(!id || envCache.has(id) || envBusy === id) return; envBusy = id;
  try{
    const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext; if(!Ctx) return;
    const ab = await blob.arrayBuffer(), ac = new Ctx(1, 2, 22050);
    const buf = await new Promise((res, rej) => { const pr = ac.decodeAudioData(ab, res, rej); if(pr && pr.then) pr.then(res, rej); });
    const sr = buf.sampleRate, hop = Math.round(sr / 43), c0 = buf.getChannelData(0), c1 = buf.numberOfChannels > 1 ? buf.getChannelData(1) : null;
    const nF = Math.floor(c0.length / hop), raw = new Float32Array(nF * 3);
    const a1 = 1 - Math.exp(-2 * Math.PI * 150 / sr), a2 = 1 - Math.exp(-2 * Math.PI * 2000 / sr);
    let l1 = 0, l2 = 0;
    for(let f = 0; f < nF; f++){
      let s0 = 0, s1 = 0, s2 = 0; const o = f * hop;
      for(let i = 0; i < hop; i++){ const x = c1 ? (c0[o+i] + c1[o+i]) * .5 : c0[o+i]; l1 += (x - l1) * a1; l2 += (x - l2) * a2; const mi = l2 - l1, hi = x - l2; s0 += l1*l1; s1 += mi*mi; s2 += hi*hi; }
      raw[f*3] = Math.sqrt(s0 / hop); raw[f*3+1] = Math.sqrt(s1 / hop); raw[f*3+2] = Math.sqrt(s2 / hop);
      if(f % 1500 === 1499) await new Promise(r => setTimeout(r, 0));
    }
    const out = new Uint8Array(nF * 4);
    for(let k = 0; k < 3; k++){ const v = []; for(let f = 0; f < nF; f += 3) v.push(raw[f*3+k]); v.sort((x, y) => x - y); const qv = v[Math.floor(v.length * .95)] || 1; for(let f = 0; f < nF; f++) out[f*4+k] = Math.min(255, raw[f*3+k] / qv * 215); }
    let avg = 0; for(let f = 0; f < nF; f++){ const lo = out[f*4]; out[f*4+3] = Math.min(255, Math.max(0, lo - avg) * 3); avg += (lo - avg) * .15; }
    envCache.set(id, { b: out, n: nF, fps: sr / hop });
    if(envCache.size > 6) envCache.delete(envCache.keys().next().value);
  }catch(e){ console.warn("analyze", e); }
  finally{ if(envBusy === id) envBusy = null; }
}

  for(let k = 0; k < 3; k++) BV[k] += (tb[k] - BV[k]) * (tb[k] > BV[k] ? .55 : .12);
  KV += (tk - KV) * (tk > KV ? .6 : .14); PV += ((playing ? 1 : 0) - PV) * .03;
  E = Math.min(1, BV[0] * .6 + KV * .5); document.documentElement.style.setProperty("--e", E.toFixed(3));
  if(bg && view === "home" && !document.hidden){
    const s = bg.scale; bg.set("T", t); bg.set("B", BV[0], BV[1], BV[2]); bg.set("K", KV); bg.set("P", PV);
    bg.set("C", stageC[0] * s, stageC[1] * s); bg.set("S", stageS * s); bg.draw();
  }
  if(!reduce || playing) requestAnimationFrame(loop); else setTimeout(() => requestAnimationFrame(loop), 500);
}
requestAnimationFrame(loop);

// splash: animated gasoline puddle
(() => {
  const sp = $("splash"), v = glView($("splashCv"), PUDDLE, Math.min(DPR * .5, 1.5)); let t0 = null, alive = true;
  const f = ts => { if(!alive) return; if(t0 === null) t0 = ts; const k = Math.min(1, (ts - t0) / 1800); if(v){ v.set("T", ts / 1000 + 4); v.set("Z", 1.6 - .6 * (1 - Math.pow(1 - k, 3))); v.draw(); } requestAnimationFrame(f); };
  requestAnimationFrame(f);
  setTimeout(() => { sp.classList.add("gone"); setTimeout(() => { alive = false; sp.remove(); }, 800); }, reduce ? 500 : 2100);
})();

// ---------- boot ----------
(async () => {
  const h0 = location.hash.slice(1); go(["lib","folders","fav"].includes(h0) ? h0 : "home"); measure(); showNow();
  db = await openDB(); booting = false; renderAll();
  const lastQ = store.get("svoi4-last", null);
  if(lastQ && Array.isArray(lastQ.queue)){ queue = lastQ.queue.filter(byId); qi = Math.min(Math.max(0, lastQ.qi || 0), queue.length - 1); playingFrom = lastQ.from || ""; if(queue.length) load(false, store.get("svoi4-pos", 0)); }
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  setTimeout(seedDemos, 2400);
})();
})();
