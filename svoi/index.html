<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>СВОИ</title>
<meta name="theme-color" content="#0c0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="СВОИ">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: волна на весь экран; сверху стеклянная шапка, снизу мини-плеер и док; «Сейчас играет» — полноэкранный лист */
:root{
  --bg:#121118; --panel:#0c0b10; --raise:#1c1a23; --raise2:#24212d; --line:#2d2a36;
  --ink:#f6f3fa; --muted:#b4aec2; --gold:#f2c84b; --amber:#e3a24a; --rose:#c45a77; --plum:#5a2f63;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hh:90px; --bh:180px; --e:0; --ease:cubic-bezier(.2,.8,.2,1);
  --gl:max(18px,env(safe-area-inset-left,0px)); --gr:max(18px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--panel)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button,input,select{font:inherit;color:inherit}
.app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
main{position:absolute;inset:0}
.wavewrap{position:absolute;inset:-40px;filter:blur(18px) saturate(1.15);transform:translateZ(0)}
canvas#wave{position:absolute;inset:40px;width:calc(100% - 80px);height:calc(100% - 80px)}
main::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgb(8 7 12 / .7) 100%)}

header{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) var(--gr) 16px var(--gl);
  background:linear-gradient(to bottom,rgb(12 11 16 / .94),rgb(12 11 16 / .74));-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);border-bottom:1px solid rgb(255 255 255 / .07)}
.logo{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.02em;line-height:1}
.hbtn{width:46px;height:46px;border-radius:50%;border:0;background:var(--gold);color:#16131c;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 20px -6px rgb(242 200 75 / .7)}
.hbtn svg{width:24px;height:24px}
.bottom{position:absolute;left:0;right:0;bottom:0;z-index:5;background:rgb(12 11 16 / .88);-webkit-backdrop-filter:blur(26px) saturate(1.4);backdrop-filter:blur(26px) saturate(1.4);border-top:1px solid rgb(255 255 255 / .08)}

.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:1;padding:calc(var(--hh) + 16px) var(--gr) calc(var(--bh) + 24px) var(--gl)}
.view:not(.home){background:rgb(18 17 24 / .92)}
.view.home{display:grid;place-items:center;overflow:hidden}
.inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.center{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
h2{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0;line-height:1.2;text-wrap:balance}
.hint{color:var(--muted);font-size:15px;margin:0;line-height:1.5}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:700}

.bigplay{position:relative;width:92px;height:92px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;color:#121118;
  background:radial-gradient(circle at 32% 26%,#fff,#efe9f5 55%,#cfc5de);box-shadow:0 0 0 1px rgb(255 255 255 / .3),inset 0 -5px 12px rgb(0 0 0 / .16);
  transform:scale(calc(1 + var(--e) * .1));transition:transform .2s linear}
.bigplay svg{width:30px;height:30px}
.bigplay::before,.bigplay::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1.5px solid rgb(255 236 190 / .55);opacity:0;pointer-events:none}
.wavetitle{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,8vw,40px);margin:6px 0 0;text-shadow:0 1px 3px rgb(0 0 0 / .45),0 0 22px rgb(40 15 40 / .35)}
.wavesub{margin:0;font-size:17px;font-weight:700;text-shadow:0 1px 3px rgb(0 0 0 / .5),0 0 18px rgb(40 15 40 / .4)}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.stat{background:rgb(12 11 16 / .55);border:1px solid rgb(255 255 255 / .1);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:15px;font-weight:700;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--raise);color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--gold);color:#16131c;border-color:var(--gold)}
.btn{font-size:16px;font-weight:800;border:0;border-radius:999px;padding:13px 20px;cursor:pointer;background:var(--gold);color:#16131c;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:20px;height:20px}
.btn.ghost{background:var(--raise);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--rose);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.search{position:relative}
.search input[type=text]{width:100%;font-size:17px;background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:13px 18px 13px 46px;min-height:50px;-webkit-appearance:none;appearance:none}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
input[type=text]{width:100%;font-size:17px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:13px 16px;min-height:50px;-webkit-appearance:none;appearance:none}
input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgb(242 200 75 / .25)}
button:focus-visible,.row:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.chip,.btn,.ib,.pp,nav button,.row,.fcard{transition:background-color .3s var(--ease),color .3s var(--ease),border-color .3s var(--ease),transform .25s var(--ease),opacity .3s}
.chip:active,.btn:active,.ib:active,.pp:active,.fcard:active{transform:scale(.95)}

.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:8px 6px;border-radius:16px;cursor:pointer}
.row.grab{grid-template-columns:24px 52px 1fr auto}
.row.sel{grid-template-columns:26px 52px 1fr}
.row:hover{background:var(--raise)}
.row.playing .t1{color:var(--gold)}
.row.picked{background:var(--raise)}
.cover{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px;color:#16131c;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgb(255 255 255 / .1)}
.meta{min-width:0}
.t1{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{color:var(--muted);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.acts{display:flex}
.ib{width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none}
.ib:hover{background:var(--line);color:var(--ink)}
.ib svg{width:22px;height:22px}
.ib.on{color:var(--rose)}
.ib.gold{color:var(--gold)}
.grip{width:24px;height:52px;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab}
.grip svg{width:18px;height:18px}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;color:#16131c}
.row.picked .check{background:var(--gold);border-color:var(--gold)}
.check svg{width:15px;height:15px}
.sortable-ghost{opacity:.35}
.empty{border:1.5px dashed var(--line);border-radius:20px;padding:30px 18px;text-align:center;color:var(--muted);font-size:16px;line-height:1.5;display:flex;flex-direction:column;gap:14px;align-items:center}

.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.fcard{text-align:left;border:1px solid var(--line);background:var(--raise);color:var(--ink);border-radius:20px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:128px;min-width:0}
.fcard .fi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#16131c}
.fcard .fi svg{width:22px;height:22px}
.fcard b{font-size:16px;overflow-wrap:anywhere}
.fcard span{font-size:13px;color:var(--muted);font-weight:700}
.fcard.new{border-style:dashed;background:transparent;color:var(--muted);align-items:center;justify-content:center;text-align:center}
.fcard.new .fi{background:var(--line);color:var(--muted)}

.prog{display:flex;flex-direction:column;gap:8px}
.prog .trk{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog .trk i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s}

.selbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px var(--gr) 12px var(--gl);border-bottom:1px solid var(--line);font-weight:800}
.mini{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px var(--gr) 10px var(--gl);position:relative;cursor:pointer}
.mbar{position:absolute;left:0;right:0;top:-2px;height:3px;background:rgb(255 255 255 / .08)}
.mbar i{display:block;height:100%;width:0;background:var(--gold);box-shadow:0 0 10px rgb(242 200 75 / .8)}
.ctrl{display:flex;gap:2px;align-items:center}
.pp{width:50px;height:50px;border-radius:50%;border:0;background:var(--ink);color:#121118;display:grid;place-items:center;cursor:pointer;flex:none}
.pp svg{width:22px;height:22px}
nav{position:relative;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgb(255 255 255 / .06);padding:0 env(safe-area-inset-right,0px) calc(env(safe-area-inset-bottom,0px) + 6px) env(safe-area-inset-left,0px)}
nav button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 2px 8px;cursor:pointer;font-size:13px;font-weight:700}
nav button svg{width:26px;height:26px;transition:transform .45s var(--ease),filter .45s var(--ease)}
nav button[aria-current="page"]{color:var(--ink)}
nav button[aria-current="page"] svg{color:var(--gold);transform:translateY(-3px);filter:drop-shadow(0 4px 10px rgb(242 200 75 / .6))}
.dock-ind{position:absolute;top:0;left:0;width:40px;height:3px;border-radius:0 0 3px 3px;background:var(--gold);box-shadow:0 0 18px 2px rgb(242 200 75 / .7);transition:transform .55s var(--ease)}

/* now playing */
.np{position:fixed;inset:0;z-index:15;background:linear-gradient(to bottom,#1b1622,#0e0c13 70%);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 12px) var(--gr) calc(env(safe-area-inset-bottom,0px) + 18px) var(--gl);transform:translateY(100%);transition:transform .5s var(--ease);visibility:hidden}
.np.open{transform:none;visibility:visible}
.np-top{display:flex;justify-content:space-between;align-items:center}
.np-top .lbl{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.np-art{flex:1;min-height:0;display:grid;place-items:center;padding:18px 0}
.np-art .art{width:min(78vw,340px,42vh);aspect-ratio:1;max-width:100%;border-radius:28px;background-size:cover;background-position:center;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:72px;color:#16131c;
  box-shadow:0 30px 60px -20px rgb(0 0 0 / .7);transform:scale(calc(.94 + var(--e) * .06));transition:transform .3s var(--ease)}
.np-meta{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.np-meta .t1{font-size:22px}
.np-meta .t2{font-size:16px}
.seek{margin-top:14px}
.seek input{width:100%;-webkit-appearance:none;appearance:none;height:28px;background:transparent;cursor:pointer}
.seek input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--gold) var(--p,0%),rgb(255 255 255 / .15) var(--p,0%))}
.seek input::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;margin-top:-7px;box-shadow:0 2px 8px rgb(0 0 0 / .4)}
.seek input::-moz-range-track{height:6px;border-radius:3px;background:rgb(255 255 255 / .15)}
.seek input::-moz-range-progress{height:6px;border-radius:3px;background:var(--gold)}
.seek input::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:0}
.times{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.np-ctrl{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:4px}
.np-ctrl .ib{width:52px;height:52px}
.np-ctrl .ib svg{width:28px;height:28px}
.skip{position:relative}
.skip b{position:absolute;font-size:9px;font-weight:800;top:50%;left:50%;transform:translate(-50%,-38%);color:currentColor}
.np-ctrl .pp{width:76px;height:76px}
.np-ctrl .pp svg{width:32px;height:32px}
.np-extra{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:6px}
.np-extra .chip{font-size:14px;padding:9px 14px}
.ib.act{color:var(--gold)}
.ib small{position:absolute;font-size:9px;font-weight:800;bottom:6px;right:8px}

/* sheets & toast */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .6);z-index:20;display:grid;align-items:end;justify-items:center}
.sheet{width:min(560px,100%);max-height:86%;overflow-y:auto;background:var(--raise);border-radius:26px 26px 0 0;display:flex;flex-direction:column;gap:12px;padding:20px var(--gr) calc(20px + env(safe-area-inset-bottom,0px)) var(--gl)}
.sheet label{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mhead{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding-bottom:6px;border-bottom:1px solid var(--line)}
.menu{display:flex;flex-direction:column}
.mi{display:flex;align-items:center;gap:14px;background:none;border:0;padding:14px 4px;font-size:17px;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;border-radius:12px}
.mi:hover{background:var(--raise2)}
.mi svg{width:22px;height:22px;color:var(--muted);flex:none}
.mi.danger,.mi.danger svg{color:var(--rose)}
.fopt{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;padding:14px 16px;cursor:pointer;font-weight:700;font-size:16px;display:flex;justify-content:space-between;gap:10px}
.fopt span{color:var(--muted);font-size:14px}
.flist{display:flex;flex-direction:column;gap:8px}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bh) + 16px);background:var(--ink);color:#121118;font-weight:800;padding:12px 18px;border-radius:999px;z-index:30;font-size:15px;max-width:calc(100% - 32px);text-align:center}

@media (prefers-reduced-motion:no-preference){
  .wavetitle,.wavesub,.stats{animation:rise 1s var(--ease) both}.wavesub{animation-delay:.15s}.stats{animation-delay:.3s}
  .bigplay{animation:pop .9s var(--ease) both}
  @keyframes rise{from{opacity:0;transform:translateY(16px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
  @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1}}
  .playing-now .bigplay::before{animation:ring 2.6s cubic-bezier(.2,.6,.3,1) infinite}
  .playing-now .bigplay::after{animation:ring 2.6s 1.3s cubic-bezier(.2,.6,.3,1) infinite}
  @keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.4);opacity:0}}
  .view.enter{animation:viewIn .5s var(--ease) both}
  .view.home.enter{animation:fadeIn .6s var(--ease) both}
  @keyframes viewIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .scrim{animation:fadeIn .25s var(--ease) both}
  .sheet{animation:sheetUp .45s var(--ease) both}
  @keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .toast{animation:toastIn .4s var(--ease) both}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
}
@media (prefers-reduced-motion:reduce){.np{transition:none}.bigplay,.np-art .art{transform:none}.dock-ind{transition:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <main>
    <div class="wavewrap" aria-hidden="true"><canvas id="wave"></canvas></div>

    <section class="view home" id="v-home">
      <div class="center">
        <button class="bigplay" id="wavePlay" aria-label="Включить всё вперемешку"></button>
        <p class="wavetitle">Моя волна</p>
        <p class="wavesub" id="waveSub">Добавь музыку кнопкой +</p>
        <div class="stats" id="stats"></div>
      </div>
    </section>

    <section class="view" id="v-lib" hidden><div class="inner">
      <div class="toolbar"><h2>Медиатека</h2><div class="chips"><span class="count" id="libCount"></span><button class="chip selbtn">Выбрать</button></div></div>
      <div class="search"><span data-i="search"></span><input type="text" id="q" placeholder="Поиск по названию и исполнителю" aria-label="Поиск"></div>
      <div class="chips" id="sortChips">
        <button class="chip" data-sort="added" aria-pressed="true">Недавние</button>
        <button class="chip" data-sort="title" aria-pressed="false">А–Я</button>
        <button class="chip" data-sort="artist" aria-pressed="false">Исполнитель</button>
        <button class="chip" data-sort="custom" aria-pressed="false">Мой порядок</button>
      </div>
      <div class="prog" id="prog" hidden><span class="count" id="progText"></span><div class="trk"><i id="progFill"></i></div></div>
      <div class="list" id="libList"></div>
    </div></section>

    <section class="view" id="v-folders" hidden><div class="inner">
      <div class="toolbar"><h2 id="fTitle">Папки</h2><div class="chips" id="fTools"></div></div>
      <div class="fgrid" id="fGrid"></div>
      <div class="chips" id="fPlay" hidden>
        <button class="btn" id="fPlayAll"><span data-i="play"></span>Слушать</button>
        <button class="btn ghost" id="fShuffle"><span data-i="shuffle"></span>Вперемешку</button>
      </div>
      <div class="list" id="folderList"></div>
    </div></section>

    <section class="view" id="v-fav" hidden><div class="inner">
      <div class="toolbar"><h2>Избранное</h2><div class="chips"><span class="count" id="favCount"></span><button class="chip selbtn">Выбрать</button></div></div>
      <div class="chips" id="favPlay" hidden>
        <button class="btn" id="favPlayAll"><span data-i="play"></span>Слушать</button>
        <button class="btn ghost" id="favShuffle"><span data-i="shuffle"></span>Вперемешку</button>
      </div>
      <div class="list" id="favList"></div>
    </div></section>
  </main>

  <header id="top">
    <div class="logo">СВОИ</div>
    <button class="hbtn" id="addBtn" aria-label="Добавить музыку"><span data-i="plus"></span></button>
  </header>

  <div class="bottom" id="bottom">
    <div class="selbar" id="selBar" hidden>
      <span id="selText">Выбрано: 0</span>
      <div class="chips" id="selActs">
        <button class="chip" id="selAll">Все</button>
        <button class="chip" id="selFav">♡ В избранное</button>
        <button class="chip" id="selFolder">В папку</button>
        <button class="chip" id="selOut" hidden>Убрать</button>
        <button class="btn danger" id="selDel" style="min-height:42px;padding:9px 16px">Удалить</button>
        <button class="chip" id="selDone">Готово</button>
      </div>
      <div class="chips" id="selAsk" hidden>
        <button class="btn danger" id="selYes">Да, удалить</button>
        <button class="btn ghost" id="selNo">Отмена</button>
      </div>
    </div>
    <div class="mini" id="mini" role="button" aria-label="Открыть плеер">

  del:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg>',

  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};
document.querySelectorAll("[data-i]").forEach(s => s.outerHTML = I[s.dataset.i]);
const setI = (id, k) => { $(id).innerHTML = I[k]; };

setI("npClose","down"); setI("npMore","more"); setI("npFav","heart"); setI("npShuffle","shuffle"); setI("npPrev","prev"); setI("npPP","play"); setI("npNext","next"); setI("npRepeat","repeat");
$("npBack").innerHTML = I.back + "<b>15</b>"; $("npFwd").innerHTML = I.fwd + "<b>15</b>";

// ---------- helpers ----------
const store = { get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch{ return d; } }, set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} } };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const PALETTE = ["#f2c84b","#e3a24a","#c45a77","#9a5bb0","#6b7be0","#4fb39a"];
const colorOf = s => PALETTE[[...String(s)].reduce((a,c) => a + c.charCodeAt(0), 0) % PALETTE.length];
const plural = (n,a,b,c) => { const m = n%100, k = n%10; return m>10&&m<20 ? c : k===1 ? a : k>=2&&k<=4 ? b : c; };
const tw = n => `${n} ${plural(n,"трек","трека","треков")}`;
const fmt = s => { if(!isFinite(s) || s < 0) s = 0; s = Math.floor(s); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = String(s%60).padStart(2,"0"); return h ? `${h}:${String(m).padStart(2,"0")}:${x}` : `${m}:${x}`; };
function toast(msg){ document.querySelectorAll(".toast").forEach(t => t.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 2400); }
function sheet(html){ const s = document.createElement("div"); s.className = "scrim"; s.innerHTML = `<div class="sheet">${html}</div>`; document.body.append(s); s.addEventListener("click", e => { if(e.target === s) s.remove(); }); return s; }
function askName(title, value, placeholder, done){
  const s = sheet(`<h2>${esc(title)}</h2><form class="inline" id="fnF"><input type="text" id="fnI" maxlength="50" placeholder="${esc(placeholder)}" value="${esc(value)}"><button class="btn" type="submit">Готово</button></form><button class="btn ghost" id="fnC">Отмена</button>`);
  const inp = s.querySelector("#fnI"); setTimeout(() => inp.focus(), 60);
  s.querySelector("#fnC").onclick = () => s.remove();
  s.querySelector("#fnF").onsubmit = e => { e.preventDefault(); const v = inp.value.trim(); if(!v){ inp.focus(); return; } s.remove(); done(v); };
}
function measure(){ const r = document.documentElement.style; r.setProperty("--hh", $("top").offsetHeight + "px"); r.setProperty("--bh", $("bottom").offsetHeight + "px"); }
new ResizeObserver(measure).observe($("top")); new ResizeObserver(measure).observe($("bottom"));

// ---------- storage: metadata in localStorage, audio & covers in IndexedDB ----------
let tracks = store.get("svoi3-tracks", []);       // [{id,title,artist,album,dur,size,added,art}]
let folders = store.get("svoi3-folders", []);     // [{id,name,color,ids:[]}]
let favs = store.get("svoi3-favs", []);           // ordered ids
let settings = store.get("svoi3-set", {sort:"added", rate:1, repeat:"off", shuffle:false});
const saveAll = () => { store.set("svoi3-tracks", tracks); store.set("svoi3-folders", folders); store.set("svoi3-favs", favs); store.set("svoi3-set", settings); };
let db = null;
function openDB(){ return new Promise(res => { try{ const r = indexedDB.open("svoi3", 1); r.onupgradeneeded = () => { r.result.createObjectStore("audio"); r.result.createObjectStore("art"); }; r.onsuccess = () => res(r.result); r.onerror = () => res(null); }catch{ res(null); } }); }
function idb(store_, mode, fn){ return new Promise(res => { if(!db) return res(null); try{ const tx = db.transaction(store_, mode); const r = fn(tx.objectStore(store_)); tx.oncomplete = () => res(r && "result" in r ? r.result : true); tx.onerror = tx.onabort = () => res(null); }catch{ res(null); } }); }
const putBlob = (st, id, b) => idb(st, "readwrite", s => s.put(b, id));
const getBlob = (st, id) => idb(st, "readonly", s => s.get(id));
const delBlob = (st, id) => idb(st, "readwrite", s => s.delete(id));
const artUrls = new Map();
async function artUrl(t){ if(!t.art) return null; if(artUrls.has(t.id)) return artUrls.get(t.id); const b = await getBlob("art", t.id); if(!b) return null; const u = URL.createObjectURL(b); artUrls.set(t.id, u); return u; }
const byId = id => tracks.find(t => t.id === id);

// ---------- MP3 tags (ID3v2): title, artist, album, cover ----------
async function readTags(file){
  try{
    const h = new Uint8Array(await file.slice(0, 10).arrayBuffer());
    if(h[0] !== 73 || h[1] !== 68 || h[2] !== 51) return {};
    const ver = h[3], ss = (b, i) => (b[i]&127)<<21 | (b[i+1]&127)<<14 | (b[i+2]&127)<<7 | (b[i+3]&127), be = (b, i) => (b[i]<<24 | b[i+1]<<16 | b[i+2]<<8 | b[i+3]) >>> 0;
    const size = ss(h, 6); const buf = new Uint8Array(await file.slice(10, 10 + Math.min(size, 8e6)).arrayBuffer());
    const dec = (enc, d) => { try{ const t = enc === 0 ? new TextDecoder("windows-1251").decode(d) : enc === 1 ? new TextDecoder("utf-16").decode(d) : enc === 2 ? new TextDecoder("utf-16be").decode(d) : new TextDecoder("utf-8").decode(d); return t.replace(/\u0000/g, "").trim(); }catch{ return ""; } };
    const out = {}; let i = 0;
    if(ver < 3) return out;
    if(h[5] & 0x40) i += ver === 4 ? ss(buf, 0) : be(buf, 0) + 4;
    while(i + 10 <= buf.length){
      const id = String.fromCharCode(buf[i], buf[i+1], buf[i+2], buf[i+3]); if(!/^[A-Z0-9]{4}$/.test(id)) break;
      const fs = ver === 4 ? ss(buf, i+4) : be(buf, i+4); if(!fs || i + 10 + fs > buf.length) break;
      const d = buf.subarray(i + 10, i + 10 + fs);
      if(id === "TIT2") out.title = dec(d[0], d.subarray(1));
      else if(id === "TPE1") out.artist = dec(d[0], d.subarray(1));
      else if(id === "TALB") out.album = dec(d[0], d.subarray(1));
      else if(id === "APIC" && !out.art){
        const enc = d[0]; let p = 1; while(p < d.length && d[p] !== 0) p++; const mime = String.fromCharCode(...d.subarray(1, p)) || "image/jpeg"; p += 2;
        if(enc === 1 || enc === 2){ while(p + 1 < d.length && !(d[p] === 0 && d[p+1] === 0)) p += 2; p += 2; } else { while(p < d.length && d[p] !== 0) p++; p++; }
        if(p < d.length) out.art = new Blob([d.slice(p)], {type: mime.includes("/") ? mime : "image/" + mime.toLowerCase()});
      }
      i += 10 + fs;
    }
    return out;
  }catch{ return {}; }
}
function durationOf(file){ return new Promise(res => { const a = new Audio(); const u = URL.createObjectURL(file); const done = v => { URL.revokeObjectURL(u); res(v); }; a.preload = "metadata"; a.onloadedmetadata = () => done(isFinite(a.duration) ? a.duration : 0); a.onerror = () => done(0); setTimeout(() => done(0), 4000); a.src = u; }); }

// ---------- import ----------
$("addBtn").onclick = () => $("fileIn").click();
$("fileIn").onchange = () => { const f = [...$("fileIn").files]; $("fileIn").value = ""; importFiles(f); };
let importing = false;
async function importFiles(list){
  const files = list.filter(f => f.type.startsWith("audio/") || /\.(mp3|m4a|wav|flac|ogg|aac|opus)$/i.test(f.name));
  if(!files.length){ toast("Выбранные файлы не похожи на музыку"); return; }
  if(importing){ toast("Подожди, предыдущие файлы ещё сохраняются"); return; }
  if(!db){ toast("Браузер не даёт сохранять файлы. Открой СВОИ с иконки на экране «Домой»."); return; }
  try{ navigator.storage?.persist?.(); }catch{}
  importing = true; if(view !== "lib") go("lib");
  $("prog").hidden = false; let ok = 0, fail = 0;
  for(let i = 0; i < files.length; i++){
    const f = files[i];
    $("progText").textContent = `Сохраняю ${i+1} из ${files.length}: ${f.name}`; $("progFill").style.width = (i / files.length * 100) + "%";
    const id = uid(), tags = await readTags(f), dur = await durationOf(f);
    const base = f.name.replace(/\.[^.]+$/, "").replace(/_/g, " ").trim(), m = base.match(/^(.+?)\s+[—–-]\s+(.+)$/);
    const t = { id, title: tags.title || (m ? m[2] : base), artist: tags.artist || (m ? m[1] : ""), album: tags.album || "", dur, size: f.size, added: Date.now(), art: !!tags.art };
    const stored = await putBlob("audio", id, f);
    if(stored === null){ fail++; continue; }
    if(tags.art) await putBlob("art", id, tags.art);
    tracks.unshift(t); ok++;
    if(i % 4 === 3){ saveAll(); renderAll(); }
  }
  saveAll(); importing = false;
  $("progFill").style.width = "100%";
  $("progText").textContent = `Добавлено: ${tw(ok)}` + (fail ? `. Не поместилось в память: ${fail}` : "");
  setTimeout(() => { $("prog").hidden = true; }, 5000);
  renderAll(); toast(`Добавлено: ${tw(ok)}`);
}

// ---------- rows ----------
function coverHTML(t, cls = "cover"){
  const ch = esc((t.artist || t.title || "?").trim()[0]?.toUpperCase() || "?");
  return `<div class="${cls}" data-art="${t.art ? t.id : ""}" style="background-color:${colorOf(t.artist || t.title)}">${t.art ? "" : ch}</div>`;
}
async function paintArt(root){ for(const el of root.querySelectorAll("[data-art]")){ const id = el.dataset.art; if(!id) continue; const u = await artUrl(byId(id) || {}); if(u){ el.style.backgroundImage = `url("${u}")`; el.textContent = ""; } } }
let selecting = false; const picked = new Set();
function row(t, ctx){
  const sub = [t.artist || "Неизвестный исполнитель", t.dur ? fmt(t.dur) : ""].filter(Boolean).join(" · ");
  if(selecting) return `<div class="row sel ${picked.has(t.id) ? "picked" : ""}" data-id="${t.id}" tabindex="0" role="checkbox" aria-checked="${picked.has(t.id)}">
    <span class="check">${picked.has(t.id) ? I.check : ""}</span>${coverHTML(t)}<div class="meta"><div class="t1">${esc(t.title)}</div><div class="t2">${esc(sub)}</div></div></div>`;
  const grab = ctx.grab ? `<span class="grip" aria-label="Перетащить">${I.grip}</span>` : "";
  const fav = favs.includes(t.id);
  return `<div class="row ${ctx.grab ? "grab" : ""} ${cur && cur.id === t.id ? "playing" : ""}" data-id="${t.id}" tabindex="0">${grab}
    ${coverHTML(t)}<div class="meta"><div class="t1">${esc(t.title)}</div><div class="t2">${esc(sub)}</div></div>
    <div class="acts"><button class="ib ${fav ? "on" : ""}" data-a="fav" aria-label="${fav ? "Убрать из избранного" : "В избранное"}">${fav ? I.heartF : I.heart}</button><button class="ib" data-a="more" aria-label="Действия">${I.more}</button></div></div>`;
}
function renderList(el, list, ctx, empty){ el.innerHTML = list.length ? list.map(t => row(t, ctx)).join("") : `<div class="empty">${empty}</div>`; el._list = list; el._ctx = ctx; paintArt(el); }

// ---------- views ----------
let view = "home", lastView = null, openFolder = null;
const LIST_OF = { lib:"libList", folders:"folderList", fav:"favList" };
function go(v){
  if(selecting && v !== view) setSelecting(false);
  if(v !== "folders") openFolder = null;
  view = v;
  document.querySelectorAll(".view").forEach(s => s.hidden = s.id !== "v-" + v);
  document.querySelectorAll("#dock button").forEach(b => b.dataset.v === v ? b.setAttribute("aria-current","page") : b.removeAttribute("aria-current"));
  if(v !== lastView){ const el = $("v-" + v); el.classList.remove("enter"); void el.offsetWidth; el.classList.add("enter"); lastView = v; }
  requestAnimationFrame(moveDockInd); renderAll();
}
function moveDockInd(){ const b = document.querySelector("#dock button[aria-current]"), ind = $("dockInd"); if(!b) return; const nb = $("dock").getBoundingClientRect(), r = b.getBoundingClientRect(); ind.style.transform = `translateX(${r.left - nb.left + r.width/2 - 20}px)`; }
addEventListener("resize", moveDockInd);
$("dock").addEventListener("click", e => { const b = e.target.closest("button[data-v]"); if(b) go(b.dataset.v); });

function libList(){
  const q = $("q").value.trim().toLowerCase();
  let list = tracks.filter(t => !q || (t.title + " " + t.artist + " " + t.album).toLowerCase().includes(q));
  const s = settings.sort;
  if(s === "title") list = list.slice().sort((a, b) => a.title.localeCompare(b.title, "ru"));
  else if(s === "artist") list = list.slice().sort((a, b) => (a.artist || "яяя").localeCompare(b.artist || "яяя", "ru") || a.title.localeCompare(b.title, "ru"));
  else if(s === "added") list = list.slice().sort((a, b) => b.added - a.added);
  return list;
}
function renderAll(){
  const n = tracks.length, total = tracks.reduce((s, t) => s + (t.dur || 0), 0);
  $("waveSub").textContent = n ? "Нажми, чтобы включить всё вперемешку" : "Добавь музыку кнопкой +";
  $("stats").innerHTML = n ? `<span class="stat">${tw(n)}</span><span class="stat">${Math.round(total/60)} мин</span><span class="stat">${favs.length} ♡</span>` : "";

// ---------- player ----------
// Plain <audio> only (no Web Audio graph): that is what keeps iOS playing in the background and on the lock screen.
const audio = $("audio");
let queue = [], qi = -1, cur = null, srcUrl = null, playingFrom = "";
function shuffled(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function playList(ids, startId, from){
  playingFrom = from || "";
  if(settings.shuffle){ const rest = shuffled(ids.filter(id => id !== startId)); queue = startId ? [startId, ...rest] : rest; qi = 0; }
  else { queue = ids.slice(); qi = Math.max(0, startId ? queue.indexOf(startId) : 0); }
  load(true);
}
async function load(autoplay, at = 0){
  const id = queue[qi]; cur = id ? byId(id) : null; if(!cur){ showNow(); return; }
  const b = await getBlob("audio", cur.id);
  if(!b){ toast("Файл трека не найден в памяти"); return; }
  if(srcUrl) URL.revokeObjectURL(srcUrl);
  srcUrl = URL.createObjectURL(b); audio.src = srcUrl; audio.playbackRate = settings.rate || 1;
  if(at) audio.addEventListener("loadedmetadata", () => { try{ audio.currentTime = at; }catch{} }, {once:true});
  if(autoplay) audio.play().catch(() => {});
  showNow(); renderAll(); updateSession();
  store.set("svoi3-last", { queue, qi, from: playingFrom });
}
function queueNext(id){ if(!cur){ playList([id], id, "Медиатека"); return; } const at = queue.indexOf(id); if(at >= 0 && at !== qi){ queue.splice(at, 1); if(at < qi) qi--; } if(at !== qi) queue.splice(qi + 1, 0, id); toast("Сыграет следующим"); }
function next(auto){
  if(!queue.length) return;
  if(auto && settings.repeat === "one"){ audio.currentTime = 0; audio.play(); return; }
  if(qi + 1 >= queue.length){ if(settings.repeat === "all" || !auto){ qi = 0; } else { audio.pause(); audio.currentTime = 0; return; } } else qi++;
  if(sleepEnd === "track" && auto){ sleepEnd = null; audio.pause(); updateSleep(); return; }
  load(true);
}
function prev(){ if(!queue.length) return; if(audio.currentTime > 3){ audio.currentTime = 0; return; } qi = (qi - 1 + queue.length) % queue.length; load(true); }
const skip = s => { if(!cur) return; audio.currentTime = Math.max(0, Math.min((audio.duration || 0) - .2, audio.currentTime + s)); };
function toggle(){ if(!cur){ if(tracks.length) playList(tracks.map(t => t.id), null, "Вся музыка"); else $("fileIn").click(); return; } audio.paused ? audio.play() : audio.pause(); }
audio.addEventListener("ended", () => next(true));
audio.addEventListener("error", () => { if(cur) toast("Не получилось включить этот файл"); });
$("wavePlay").onclick = () => { if(cur){ toggle(); return; } if(!tracks.length){ $("fileIn").click(); return; } settings.shuffle = true; saveAll(); playList(tracks.map(t => t.id), null, "Моя волна"); };
$("mPP").onclick = e => { e.stopPropagation(); toggle(); };
$("mNext").onclick = e => { e.stopPropagation(); next(false); };
$("mBack").onclick = e => { e.stopPropagation(); skip(-15); };

$("npPP").onclick = toggle; $("npNext").onclick = () => next(false); $("npPrev").onclick = prev;
$("npBack").onclick = () => skip(-15); $("npFwd").onclick = () => skip(15);
$("npFav").onclick = () => { if(cur) toggleFav(cur.id); };

async function updateSession(){
  if(!("mediaSession" in navigator) || !cur) return;
  let artwork = [{ src:"icon-512.png", sizes:"512x512", type:"image/png" }];
  try{ const b = cur.art ? await getBlob("art", cur.id) : null; if(b){ const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); }); artwork = [{ src: data, sizes:"512x512", type: b.type || "image/jpeg" }]; } }catch{}

}

  const h = (a, f) => { try{ navigator.mediaSession.setActionHandler(a, f); }catch{} };

  const s = sheet(`<div class="toolbar"><h2>Очередь</h2><span class="count">${tw(upNext.length)}</span></div>
    ${cur ? `<p class="hint">Сейчас: <b style="color:var(--ink)">${esc(cur.title)}</b></p>` : ""}
    <div class="list" id="qList">${upNext.map(t => `<div class="row grab" data-id="${t.id}"><span class="grip">${I.grip}</span>${coverHTML(t)}<div class="meta"><div class="t1">${esc(t.title)}</div><div class="t2">${esc(t.artist || "")}</div></div><div class="acts"><button class="ib" data-q="rm" aria-label="Убрать из очереди">${I.out}</button></div></div>`).join("") || '<div class="empty">Дальше ничего нет</div>'}</div>`);
  paintArt(s); const ql = s.querySelector("#qList");
  ql.addEventListener("click", e => {
    const r = e.target.closest(".row"); if(!r) return;
    if(e.target.closest("[data-q=rm]")){ const i = queue.indexOf(r.dataset.id, qi + 1); if(i > qi) queue.splice(i, 1); r.remove(); return; }
    if(e.target.closest(".grip")) return;
    const i = queue.indexOf(r.dataset.id, qi + 1); if(i > qi){ qi = i; load(true); s.remove(); }
  });
  if(window.Sortable) Sortable.create(ql, { handle:".grip", draggable:".row", animation:160, forceFallback:true, onEnd: () => { const ids = [...ql.querySelectorAll(".row[data-id]")].map(x => x.dataset.id); queue = queue.slice(0, qi + 1).concat(ids); } });
};

// sleep timer
let sleepTimer = null, sleepEnd = null;
function updateSleep(){ $("npSleep").textContent = sleepEnd === "track" ? "Сон: после трека" : typeof sleepEnd === "number" ? `Сон: ${Math.max(1, Math.round((sleepEnd - Date.now()) / 60000))} мин` : "Сон"; $("npSleep").setAttribute("aria-pressed", !!sleepEnd); }
setInterval(updateSleep, 30000);
$("npSleep").onclick = () => {
  const s = sheet(`<h2>Таймер сна</h2><div class="flist">
    ${[15,30,45,60].map(m => `<button class="fopt" data-s="${m}">${m} минут</button>`).join("")}
    <button class="fopt" data-s="track">После этого трека</button><button class="fopt" data-s="off">Выключить</button></div>`);
  s.addEventListener("click", e => {
    const v = e.target.closest("[data-s]")?.dataset.s; if(!v) return;
    clearTimeout(sleepTimer); sleepEnd = null;
    if(v === "track") sleepEnd = "track";
    else if(v !== "off"){ const ms = +v * 60000; sleepEnd = Date.now() + ms; sleepTimer = setTimeout(() => { audio.pause(); sleepEnd = null; updateSleep(); }, ms); }
    updateSleep(); s.remove(); toast(v === "off" ? "Таймер выключен" : "Таймер сна включён");
  });
};

// ---------- wave (visual only, gently pulses while music plays) ----------
const cv = $("wave"), cx = cv.getContext("2d");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const RES = .55;
const layers = [
  {r:.62, c:[[34,31,62,.96],[28,25,50,0]], depth:.015, sp:.45, seed:1.13, amp:.10},
  {r:.52, c:[[88,44,104,.92],[66,34,88,0]], depth:.03, sp:.60, seed:2.71, amp:.11},
  {r:.42, c:[[190,82,114,.88],[140,58,100,0]], depth:.05, sp:.78, seed:3.97, amp:.12},
  {r:.32, c:[[246,196,92,1],[226,140,74,0]], depth:.075, sp:.95, seed:5.41, amp:.13},
  {r:.17, c:[[255,236,190,.85],[255,214,140,0]], depth:.10, sp:1.2, seed:7.77, amp:.16, screen:true}
];
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a ?? c[3]})`;
function size(){ cv.width = Math.max(1, cv.clientWidth * RES); cv.height = Math.max(1, cv.clientHeight * RES); cx.setTransform(RES,0,0,RES,0,0); }
addEventListener("resize", size); size();
const P = {x:0, y:0, tx:0, ty:0};
addEventListener("pointermove", e => { P.tx = e.clientX / innerWidth - .5; P.ty = e.clientY / innerHeight - .5; }, {passive:true});
let E = 0, rot = 0, last = 0;
function draw(ts){
  const w = cv.clientWidth, h = cv.clientHeight; if(!w) return;
  const t = reduce ? 0 : ts / 1000, dt = Math.min(.05, (ts - last) / 1000 || .016); last = ts;
  const playing = !audio.paused, target = playing ? .35 + .25 * Math.max(0, Math.sin(t * 7.5)) * Math.max(0, Math.sin(t * 1.9)) : 0;
  E += (target - E) * .08;
  document.documentElement.style.setProperty("--e", E.toFixed(3));
  P.x += (P.tx - P.x) * .05; P.y += (P.ty - P.y) * .05; rot += dt * (.04 + E * .12);
  cx.clearRect(0, 0, w, h);
  const base = Math.min(w * 1.15, h * .95), breath = 1 + Math.sin(t * .55) * .018;
  layers.forEach((L, li) => {
    const mx = w/2 + P.x*w*L.depth*2, my = h*.47 + P.y*h*L.depth*2, R = base * L.r * breath * (1 + E*.16*(li+1)/3);
    const g = cx.createRadialGradient(mx, my - R*.08, R*.05, mx, my, R*1.15);
    g.addColorStop(0, rgba(L.c[0])); g.addColorStop(.62, rgba(L.c[0], L.c[0][3]*.92)); g.addColorStop(1, rgba(L.c[1]));
    cx.globalCompositeOperation = L.screen ? "screen" : "source-over"; cx.fillStyle = g; cx.beginPath();
    for(let i = 0; i <= 120; i++){
      const a = i/120*Math.PI*2 + rot*(li%2 ? -1 : 1)*.6;
      const n = Math.sin(a*2 + t*.31*L.sp + L.seed)*L.amp*.9 + Math.sin(a*3 - t*.23*L.sp + L.seed*1.7)*L.amp*.6 + Math.cos(a*5 + t*.17*L.sp + L.seed*.5)*L.amp*.28 + Math.sin(a*7 - t*.9*L.sp)*E*.05;
      const rr = R*(1 + n), x = mx + Math.cos(a)*rr*.98, y = my + Math.sin(a)*rr*1.12;
      i ? cx.lineTo(x, y) : cx.moveTo(x, y);
    }
    cx.closePath(); cx.fill();
  });
  cx.globalCompositeOperation = "source-over";
}
function loop(ts){ if(!document.hidden) draw(ts); if(!reduce) requestAnimationFrame(loop); }
requestAnimationFrame(loop);

// ---------- boot ----------
(async () => {
  db = await openDB();
  go("home"); measure(); showNow();
  const lastQ = store.get("svoi3-last", null);
  if(lastQ && Array.isArray(lastQ.queue)){
    queue = lastQ.queue.filter(byId); qi = Math.min(Math.max(0, lastQ.qi || 0), queue.length - 1); playingFrom = lastQ.from || "";
    if(queue.length) load(false, store.get("svoi3-pos", 0));
  }
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
})();
